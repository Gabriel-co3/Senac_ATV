<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> LOGIN </title>

    <link rel="stylesheet" href="css/estilo.css">

</head>

<body>

    <main class="container">

        <section class="login">

            <h1>LOGIN</h1>

            <p>ACESSO AO SISTEMA</p>

            <form id="loginForm">

                <div class="campo">

                    <label>USUÁRIO</label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                    >

                </div>

                <div class="campo">

                    <label>SENHA</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                    >

                </div>

                <button type="submit" class="botao">
                    ENTRAR
                </button>

                <p id="mensagem"></p>

            </form>

        </section>

        <section class="imagem">

            <img
                src="img/images.jpg"
                alt="Mr. Robot"
            >

        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
